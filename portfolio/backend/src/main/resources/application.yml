server:
  port: 8080

spring:
  application:
    name: portfolio-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:portfolio_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:cyber}
    password: ${MYSQL_PASSWORD:cyber123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      # 上传大小限制：视频最大 200MB，单请求最大 210MB
      max-file-size: 200MB
      max-request-size: 210MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 调试时打开日志：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ---------- 业务配置 ----------
app:
  # 上传文件在服务器磁盘的存储根目录
  upload:
    path: ${UPLOAD_PATH:./uploads}
    # 对外访问前缀（由 WebConfig 映射到存储目录）
    url-prefix: /uploads
  jwt:
    # 生产环境务必通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:portfolio-lee-jwt-secret-key-change-me-in-prod-2026}
    # 令牌有效期（毫秒），默认 24 小时
    expire: ${JWT_EXPIRE:86400000}
