# 个人工作台 Nginx 配置
# 三条链路：
#   /            -> 工作台（前端静态 + 后端 API）
#   /dsh/        -> DeepSeek Harness 官方界面（需登录态，反代到 127.0.0.1:3080）
#   /__auth*     -> 内部鉴权子请求，禁止外部直接访问

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream workbench_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 64m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- DSH 数据通道 ----------
    # DSH 前端的数据请求写死为绝对路径 /api/...（主通道是 /api/remote.mux 的 WebSocket，
    # 设置镜像也跑在上面）。因此 /api 必须整段让给 DSH —— 工作台自身接口已改用 /wb-api。
    # 同样挂 auth_request：未登录或无 dsh:access 权限一律拦截，保证只能从工作台进入。
    location = /api {
        auth_request /__auth_dsh;
        error_page 401 403 = @dsh_denied;
        error_page 502 504 = @dsh_api_down;
        proxy_pass http://127.0.0.1:3080/api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        auth_request /__auth_dsh;
        error_page 401 403 = @dsh_denied;
        error_page 502 504 = @dsh_api_down;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;

        # WebSocket / SSE 支持（DSH 的终端、设置镜像与任务流需要长连接）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 工作台自身接口（/api 已让给 DSH） ----------
    location / {
        proxy_pass http://workbench_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # ---------- DSH 入口 ----------
    # 无尾斜杠时补上，保证 <base href="./"> 正确解析
    location = /dsh {
        return 301 /dsh/;
    }

    location /dsh/ {
        auth_request /__auth_dsh;

        # 401 = 未登录，403 = 无权限
        error_page 401 403 = @dsh_denied;
        # DSH 未启动时反代连接被拒，回落到工作台并给出提示
        error_page 502 504 = @dsh_down;

        proxy_pass http://127.0.0.1:3080/;
        proxy_http_version 1.1;

        # WebSocket / SSE 支持（DSH 的终端与任务流需要长连接）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 内部鉴权（不可从外部访问） ----------
    location = /__auth_dsh {
        internal;
        proxy_pass http://workbench_backend/__auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length   "";
        proxy_set_header X-Auth-Scope     dsh;
        proxy_set_header X-Original-URI   $request_uri;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header Cookie           $http_cookie;
    }

    location @dsh_denied {
        return 302 /harness?denied=1;
    }

    location @dsh_down {
        return 302 /harness?dsh=down;
    }

    # DSH 未启动时，数据通道返回 JSON 而不是 302（前端是 fetch/XHR，跳转无意义）
    location @dsh_api_down {
        default_type application/json;
        return 503 '{"error":"DeepSeek Harness 未启动"}';
    }
}
