version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cybershow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cyber_show_root_2026}
      MYSQL_DATABASE: ${MYSQL_DB:-cyber_show}
      MYSQL_USER: ${MYSQL_USER:-cyber}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyber123}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --innodb-buffer-pool-size=128M --performance-schema=OFF --max-connections=50
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-cyber_show_root_2026}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ../backend
    container_name: cybershow-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DB: ${MYSQL_DB:-cyber_show}
      MYSQL_USER: ${MYSQL_USER:-cyber}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-cyber123}
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms128m -Xmx384m"
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: cybershow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend-build

  # 一次性构建任务：编译前端并输出到共享卷
  frontend-build:
    build: ../frontend
    container_name: cybershow-frontend-build
    volumes:
      - frontend-dist:/output

volumes:
  mysql-data:
  frontend-dist:
